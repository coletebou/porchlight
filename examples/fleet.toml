# One file for a whole fleet, shared through your dotfiles. Each machine picks
# its section by hostname; the hub pushes account-wide data to the peers.
[general]
identity = "personal"
secrets_files = ["~/.config/porchlight/secrets.env"]

[fleet]
order = ["studio", "web-1", "db-1", "nas"]

[sources.sites]                  # probed once, by the hub
targets = [{ label = "shop", url = "https://shop.example.com" }, { label = "docs", url = "https://docs.example.com" }]

[sources.github]
repos = ["acme/shop", "acme/infra"]
branch = "main"

[sources.aws_account]            # collected by the hub, shown on every machine
profile = "readonly"             # a read-only role: the panel never falls back to another login
home_regions = ["us-east-1"]
cost_explorer = "daily"          # one $0.01 Cost Explorer request a day

[hosts."studio"]                 # the desktop: the hub
fleet.peers = ["web-1", "db-1", "nas"]
theme.accent = "porchlight"
# DROVER needs no setting: each machine reads its own Drover daemon, and the hub
# also reads every daemon's version and the credential pool.

[hosts."web-*"]
general.role = "server"
theme.accent = "dusk"
fleet.badge = "docker"           # "12/12" containers in the hub's fleet table
sources.health.targets = [{ label = "shop", url = "http://127.0.0.1:3000/health" }]

[hosts."db-*"]
general.role = "server"
theme.accent = "aurora"
sources.backups.units = ["pg-backup"]

[hosts."nas"]
general.role = "server"
system.mounts = ["/", "/volume1"]
system.mount_labels = { "/volume1" = "pool" }
